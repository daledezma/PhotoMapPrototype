<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhotoMap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand">📍 PhotoMap</span>
      <div class="d-flex align-items-center gap-2">
        <span id="account" class="text-white-50 small">Not connected</span>
        <button id="connectBtn" class="btn btn-outline-light btn-sm">Connect MetaMask</button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div id="status" class="alert alert-secondary small">Connect MetaMask to load the contract.</div>

    <div class="row g-4">
      <!-- Add photo -->
      <div class="col-md-5">
        <div class="card">
          <div class="card-header fw-semibold">Add a photo</div>
          <div class="card-body">
            <form id="addForm">
              <div class="mb-3">
                <label class="form-label">Photo</label>
                <div id="dropZone" class="border border-2 border-secondary-subtle rounded p-4 text-center bg-white" style="border-style:dashed !important;cursor:pointer">
                  <img id="preview" class="img-fluid rounded mb-2 d-none" style="max-height:160px" alt="Selected photo preview">
                  <div id="dropText" class="text-muted">Drag &amp; drop a photo here<br><span class="small">or click to choose a file</span></div>
                  <input type="file" id="fileInput" accept="image/*" class="d-none">
                </div>
              </div>
              <div class="mb-3">
                <label for="ipfsHash" class="form-label">IPFS hash <span class="text-muted small">(simulated from the file)</span></label>
                <input id="ipfsHash" class="form-control small" placeholder="Drop a photo to generate" required>
              </div>
              <div class="mb-3">
                <label for="location" class="form-label">Location (lat,lng)</label>
                <input id="location" class="form-control" placeholder="41.8781,-87.6298" required>
              </div>
              <button class="btn btn-primary w-100" type="submit">Pin Photo</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Photo list -->
      <div class="col-md-7">
        <div class="card">
          <div class="card-header d-flex justify-content-between">
            <span class="fw-semibold">Photos on the map</span>
            <span>Count: <span id="count" class="badge bg-primary">0</span></span>
          </div>
          <ul id="photoList" class="list-group list-group-flush">
            <li class="list-group-item text-muted">No photos yet.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
